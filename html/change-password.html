<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta Tags & SEO  -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <meta name="description" content="Change your Flixora account password securely.">
    <meta name="keywords" content="change password, security, account settings, Flixora">
    <meta name="author" content="Flixora Team">

    <!-- Open Graph -->
    <meta property="og:title" content="Flixora - Change Password">
    <meta property="og:description" content="Update your Flixora account password.">
    <meta property="og:type" content="website">

    <!-- Title -->
    <title>Flixora – Change Password</title>

    <!-- The website icon image -->
    <link rel="icon" href="../images/cinema.png" type="image/png">

    <!-- Bootstrap & CDN Links -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- External CSS Docs -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">

</head>
<body>
    <!-- Change Password Content -->
    <section class="login-container">
        <div class="login-card">
            <h2><a href="account.html">Change Password</a></h2>

            <form id="change-password-form">
                <!-- Current Password -->
                <label for="current-password">Current Password</label>
                <div class="password-wrapper" style="position: relative;">
                    <input type="password" id="current-password" placeholder="••••••••" required style="width: 100%; padding-right: 40px;">
                    <i class="bi bi-eye-slash toggle-password" data-target="current-password" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #aaa;"></i>
                </div>

                <!-- New Password -->
                <label for="new-password">New Password</label>
                <div class="password-wrapper" style="position: relative;">
                    <input type="password" id="new-password" placeholder="••••••••" required style="width: 100%; padding-right: 40px;">
                    <i class="bi bi-eye-slash toggle-password" data-target="new-password" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #aaa;"></i>
                </div>

                <!-- Confirm New Password -->
                <label for="confirm-password">Confirm New Password</label>
                <div class="password-wrapper" style="position: relative;">
                    <input type="password" id="confirm-password" placeholder="••••••••" required style="width: 100%; padding-right: 40px;">
                    <i class="bi bi-eye-slash toggle-password" data-target="confirm-password" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #aaa;"></i>
                </div>

                <button type="submit" class="login-button">Update Password</button>
            </form>
        </div>
    </section>

    <!-- JS Docs -->
    <script src="../javascript/auth.js"></script>

</body>
</html>
