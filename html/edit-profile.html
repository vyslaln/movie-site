<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta Tags & SEO  -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <meta name="description" content="Edit your Flixora account profile, name, and avatar settings.">
    <meta name="keywords" content="edit profile, account settings, Flixora">
    <meta name="author" content="Flixora Team">

    <!-- Open Graph -->
    <meta property="og:title" content="Flixora - Edit Profile">
    <meta property="og:description" content="Update your Flixora account profile details.">
    <meta property="og:type" content="website">

    <!-- Title -->
    <title>Flixora – Edit Profile</title>

    <!-- The website icon image -->
    <link rel="icon" href="../images/cinema.png" type="image/png">

    <!-- Bootstrap & CDN Links -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- External CSS Docs -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">

</head>
<body>
    <!-- Edit Profile Content -->
    <section class="login-container">
        <div class="login-card">
            <h2><a href="account.html">Edit Profile</a></h2>

            <form id="edit-profile-form">
                <!-- Profile Picture File Upload -->
                <label for="profile-avatar">Profile Picture</label>
                <input type="file" id="profile-avatar" accept="image/*">

                <!-- Name Section -->
                <label for="profile-name">Name</label>
                <input type="text" id="profile-name" placeholder="Your name" required>

                <!-- Email Section -->
                <label for="new-email">Email</label>
                <input type="email" id="new-email" placeholder="you@example.com" required>

                <button type="submit" class="login-button">Save Changes</button>
            </form>
        </div>
    </section>

    <!-- JS Docs -->
    <script src="../javascript/auth.js"></script>

</body>
</html>
