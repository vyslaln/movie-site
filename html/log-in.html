<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta Tags & SEO  -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <meta name="description" content="Log in to your Flixora account to access your watchlist and personalized recommendations.">
    <meta name="keywords" content="login, sign in, Flixora">
    <meta name="author" content="Flixora Team">

    <!-- Title -->
    <title>Flixora – Log In</title>

    <!-- The website icon image -->
    <link rel="icon" href="../images/cinema.png" type="image/png">

    <!-- Bootstrap & CDN Links -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- External CSS Docs -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">

</head>
<body>
    <!-- Login Content -->
    <section class="login-container">
        <div class="login-card">
            <h2><a href="index.html">Flixora</a></h2>

            <form id="login-form">
                <label for="login-name">Name</label>
                <input type="text" id="login-name" placeholder="Your name" required>

                <label for="login-email">Email</label>
                <input type="email" id="login-email" placeholder="you@example.com" required>

                <button type="submit" class="login-button">Log In</button>
            </form>
        </div>
    </section>

    <!-- JS Docs -->
    <script src="../javascript/auth.js"></script>

</body>
</html>
